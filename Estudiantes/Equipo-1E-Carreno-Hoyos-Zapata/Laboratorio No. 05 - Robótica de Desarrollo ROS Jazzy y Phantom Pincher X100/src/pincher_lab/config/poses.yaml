# Poses guardadas para la enseñanza y repetición (Actividad 13).
# Orden: waist, shoulder, elbow, wrist, gripper  (grados).
# Editable desde el modo 'record' de teach_repeat o a mano.
poses:
  reposo:        [0, 0, 0, 0, -45]
  saludo_arriba: [0, -45, 60, 30, -45]
  mirar_izq:     [70, -20, 40, 20, -45]
  mirar_der:     [-70, -20, 40, 20, -45]
  recoger:       [0, 55, -40, -30, -10]
  soltar:        [0, 55, -40, -30, -80]
  extendido:     [0, -30, 20, 10, -45]
  # Recogido. La version anterior [0, 60, 90, 60, 0] metia el antebrazo contra
  # la caneca frontal verde (-44 mm de holgura): choque comprobado en el robot.
  # Con el hombro a 10 grados queda recogido pero por encima del borde.
  encogido:      [0, 10, 95, 60, -45]
